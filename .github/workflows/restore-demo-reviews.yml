name: Restore Demo Reviews

on:
  schedule:
    # Every 12 hours
    - cron: '0 */12 * * *'

  # Allow manual execution from GitHub
  workflow_dispatch:

jobs:
  restore-demo-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run restore script
        env:
          NODE_ENV: production
          DATABASE: ${{ secrets.DATABASE }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_LOCAL: ${{ secrets.DATABASE_LOCAL }}
        run: npm run restore-demo-reviewss
